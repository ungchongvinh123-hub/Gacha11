name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Giải nén project (tự tìm file zip bất kỳ tên gì)
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Đang giải nén: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .
          rm -f "$ZIP_FILE"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cài đặt dependencies
        run: npm install

      - name: Bật export tĩnh cho Next.js (bỏ API server nếu có)
        run: |
          rm -rf src/app/api
          if grep -q "output:" next.config.ts; then
            echo "next.config.ts đã có output, bỏ qua"
          else
            sed -i 's/const nextConfig: NextConfig = {};/const nextConfig: NextConfig = { output: "export" };/' next.config.ts
          fi

      - name: Build web (next build → out/)
        run: npm run build

      - name: Đồng bộ vào project Android (Capacitor)
        run: npx cap sync android

      - name: Cài Gradle thủ công (tránh bước kiểm tra jar cũ bị lỗi)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q gradle-8.14.3-bin.zip -d $HOME
          echo "$HOME/gradle-8.14.3/bin" >> $GITHUB_PATH

      - name: Xoá wrapper cũ và tạo lại (file gốc trong zip bị hỏng)
        working-directory: android
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          rm -f gradle/wrapper/gradle-wrapper.properties
          gradle wrapper --gradle-version 8.14.3

      - name: Cấp quyền chạy gradlew
        run: chmod +x android/gradlew

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Tải APK lên (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk      - name: Bật export tĩnh cho Next.js (bỏ API server nếu có)
        run: |
          rm -rf src/app/api
          if grep -q "output:" next.config.ts; then
            echo "next.config.ts đã có output, bỏ qua"
          else
            sed -i 's/const nextConfig: NextConfig = {};/const nextConfig: NextConfig = { output: "export" };/' next.config.ts
          fi

      - name: Build web (next build → out/)
        run: npm run build

      - name: Đồng bộ vào project Android (Capacitor)
        run: npx cap sync android

      - name: Cài Gradle (dùng để tạo lại wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Tạo lại gradle-wrapper.jar (file cũ trong zip có thể bị hỏng khi tải qua điện thoại)
        working-directory: android
        run: gradle wrapper --gradle-version 8.14.3

      - name: Cấp quyền chạy gradlew
        run: chmod +x android/gradlew

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Tải APK lên (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
